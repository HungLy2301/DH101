<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" shape-rendering="crispEdges" class="hung-portrait" role="img" aria-label="Animated pixel-art portrait of Hung Ly">
  <style>
    .hung-portrait { width: 100%; height: 100%; display: block; }
    [data-theme="dark"] .hung-portrait {
      --hair: #0F0F14;
      --skin: #D9B89A;
      --skin-shade: #B8956F;
      --eye: #0F0F14;
      --mouth: #A8635B;
      --polo: #E8E2D4;
      --sweater: #B8A582;
    }
    .figure { animation: bob 4s ease-in-out infinite; transform-origin: center; }
    .eyes { animation: blink 4.5s infinite; transform-origin: center 13px; }
    .mouth-rect { animation: smile 6s ease-in-out infinite; transform-origin: 20px 21px; }
    .sparkle { animation: sparkle 3s ease-in-out infinite; transform-origin: center; }
    .sparkle-1 { animation-delay: 0s; }
    .sparkle-2 { animation-delay: 1s; }
    .sparkle-3 { animation-delay: 2s; }
    .sparkle-4 { animation-delay: 0.5s; }
    .sparkle-5 { animation-delay: 1.5s; }
    .code-particle { animation: float 5s ease-in-out infinite; opacity: 0; }
    .code-particle-1 { animation-delay: 0s; }
    .code-particle-2 { animation-delay: 1.7s; }
    .code-particle-3 { animation-delay: 3.4s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-0.4px); }
    }
    @keyframes blink {
      0%, 92%, 96%, 100% { transform: scaleY(1); }
      94%                { transform: scaleY(0.1); }
    }
    @keyframes smile {
      0%, 80%, 100% { transform: scaleX(1); }
      40%           { transform: scaleX(1.1); }
    }
    @keyframes sparkle {
      0%, 100%   { opacity: 0; transform: scale(0.5); }
      30%, 70%   { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(-10px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .figure, .eyes, .mouth-rect, .sparkle, .code-particle { animation: none; }
    }
  </style>

  <g class="sparkles-bg">
    <rect class="sparkle sparkle-1" x="3" y="8" width="1" height="1" fill="var(--accent, #B83838)"/>
    <rect class="sparkle sparkle-2" x="36" y="12" width="1" height="1" fill="var(--accent, #B83838)"/>
    <rect class="sparkle sparkle-3" x="5" y="20" width="1" height="1" fill="var(--accent, #B83838)"/>
    <rect class="sparkle sparkle-4" x="37" y="22" width="1" height="1" fill="var(--accent, #B83838)"/>
    <rect class="sparkle sparkle-5" x="2" y="28" width="1" height="1" fill="var(--accent, #B83838)"/>
  </g>

